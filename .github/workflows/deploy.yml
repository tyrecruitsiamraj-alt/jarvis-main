name: Deploy to Linux Server

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy via SSH
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  password: ${{ secrets.SSH_PASSWORD }}
                  port: ${{ secrets.SSH_PORT || 22 }}
                  command_timeout: 90m
                  script: |
                      set -euo pipefail
                      cd jarvis-main
                      # server เป็น deployment copy — fetch แล้ว reset ให้ตรง main เสมอ (กัน divergent-branches ทำ deploy พัง)
                      # เก็บ state เดิมไว้ใน backup branch ก่อน เผื่อมีงานที่แก้ตรงบน server
                      git fetch https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_PASSWORD }}@github.com/tyrecruitsiamraj-alt/jarvis-main.git main
                      git branch "backup-pre-deploy-$(date +%Y%m%d-%H%M%S)" || true
                      git reset --hard FETCH_HEAD
                      chmod +x scripts/sync-env.sh
                      ./scripts/sync-env.sh .env POSTMARK_SERVER_TOKEN "${{ secrets.POSTMARK_SERVER_TOKEN }}"
                      ./scripts/sync-env.sh .env EMAIL_SENDER "${{ secrets.EMAIL_SENDER }}"
                      ./scripts/sync-env.sh .env APP_PUBLIC_URL "https://jarvis.siamrajathanee.dev"
                      ./scripts/sync-env.sh .env AZURE_AD_TENANT_ID "${{ secrets.AZURE_AD_TENANT_ID }}"
                      ./scripts/sync-env.sh .env AZURE_AD_CLIENT_ID "${{ secrets.AZURE_AD_CLIENT_ID }}"
                      ./scripts/sync-env.sh .env AZURE_AD_CLIENT_SECRET "${{ secrets.AZURE_AD_CLIENT_SECRET }}"
                      ./scripts/sync-env.sh .env AUTH_TOKEN_TTL_SECONDS "${{ secrets.AUTH_TOKEN_TTL_SECONDS }}"
                      ./scripts/sync-env.sh .env AUTH_COOKIE_SECURE "true"
                      ./scripts/sync-env.sh .env VITE_DEV_ROLE_ENTRY "false"
                      ./scripts/sync-env.sh .env JARVIS_DEV_ROLE_LOGIN "false"
                      ./scripts/sync-env.sh .env JARVIS_ALLOW_PUBLIC_REGISTER "false"
                      ./scripts/sync-env.sh .env MATCH_PRECOMPUTE_ENABLED "true"
                      ./scripts/sync-env.sh .env CORS_ALLOWED_ORIGINS "https://jarvis.siamrajathanee.dev,https://jarvis-main-tyteam.vercel.app,http://localhost:5173"
                      ./scripts/sync-env.sh .env LUMOS_API_KEY "${{ secrets.LUMOS_API_KEY }}"
                      ./scripts/sync-env.sh .env IRECRUIT_DB_HOST "${{ secrets.IRECRUIT_DB_HOST }}"
                      ./scripts/sync-env.sh .env IRECRUIT_DB_PORT "${{ secrets.IRECRUIT_DB_PORT }}"
                      ./scripts/sync-env.sh .env IRECRUIT_DB_USER "${{ secrets.IRECRUIT_DB_USER }}"
                      ./scripts/sync-env.sh .env IRECRUIT_DB_PASSWORD "${{ secrets.IRECRUIT_DB_PASSWORD }}"
                      ./scripts/sync-env.sh .env IRECRUIT_DB_NAME "${{ secrets.IRECRUIT_DB_NAME }}"
                      ./scripts/sync-env.sh .env RECRUIT_REGISTER_OWNER "${{ secrets.RECRUIT_REGISTER_OWNER }}"
                      # ส่งใบสมัครจากหน้าสาธารณะเข้าคิว AI โทรอัตโนมัติ
                      # เจ้าของสั่งไว้ตั้งแต่ 15 ส.ค. 2569 (migration 090) แต่สวิตช์นี้ไม่เคยถูกใส่
                      # ใน deploy จึงปิดอยู่บนเครื่องจริงมาตลอด — ใบสมัคร 17 ส.ค. เลยไม่เข้าคิวสักใบ
                      # (ยืนยัน 19 ส.ค.: คิวมี card-/ir-/follow- แต่ไม่มี app- เลยสักแถว)
                      ./scripts/sync-env.sh .env APPLICATION_AUTO_DISPATCH_ENABLED "true"

                      # ตัวย้ายใบสมัครอัตโนมัติ (19 ส.ค. 2569) — เจ้าของเคาะว่า "เปิดโหมดลองดูก่อน"
                      # ENABLED=true เดินรอบทุก 15 นาทีแล้วบันทึกว่า "รอบนี้จะย้ายใครไปไหน"
                      # APPLY=false คือยังไม่เขียนจริง · ดูผลที่ ตั้งค่า → ย้ายใบสมัครอัตโนมัติ
                      # ยามเฝ้าระบบ — เปิดเฉพาะเครื่องจริง (ฐาน dev = prod ถ้าเปิดบน dev
                      # จะเด้งแจ้งเตือนผิด ๆ ไปหาแอดมินบน production)
                      ./scripts/sync-env.sh .env SYSTEM_HEALTH_WATCH_ENABLED "true"
                      ./scripts/sync-env.sh .env APPLICATION_AUTO_MOVE_ENABLED "true"
                      ./scripts/sync-env.sh .env APPLICATION_AUTO_MOVE_APPLY "false"
                      ./scripts/sync-env.sh .env MATCH_PRECOMPUTE_ENABLED "true"
                      docker compose up -d --build
                      docker compose exec -T app npm run db:migrate
                      docker compose exec -T app npx tsx scripts/verify-api-registry.mjs
